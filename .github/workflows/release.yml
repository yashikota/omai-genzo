name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'push' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup svu
        if: github.event_name == 'workflow_dispatch'
        uses: freerangebytes/setup-svu@v0.2.1

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        id: tag
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail

          version="$(svu "$BUMP_TYPE")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$version"
          git push origin "$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Created release tag: $version"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup aqua
        uses: aquaproj/aqua-installer@v3.1.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK for Release
        run: aqua exec -- task build

      - name: Prepare APK Release Artifact
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.version || github.ref_name }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT_APK="omai-genzo-${RELEASE_TAG}.apk"

          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "$OUTPUT_APK"
            echo "Renamed $APK_PATH to $OUTPUT_APK"
          else
            echo "APK file not found at $APK_PATH"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: omai-genzo-*.apk
          tag_name: ${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.version || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.version || github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
