version: '3'

vars:
  GRADLEW: '{{if eq OS "windows"}}gradlew.bat{{else}}./gradlew{{end}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  format:
    aliases: [fmt]
    desc: Run Code Formatter (Spotless + ktlint auto-fix)
    cmds:
      - '{{.GRADLEW}} format --no-daemon'

  lint:
    aliases: [check, linter]
    desc: Run Code Linter (Spotless Check)
    cmds:
      - '{{.GRADLEW}} lintCheck --no-daemon'

  test:
    aliases: [tester]
    desc: Run Unit Tests
    cmds:
      - '{{.GRADLEW}} testAll --no-daemon'

  test:native:
    desc: Run host-side tests for the pure C++ pieces (JPEG probe, file view) under ASan/UBSan
    cmds:
      - mkdir -p build
      - g++ -std=c++17 -O1 -g -fsanitize=address,undefined -Wall -Wextra -I app/src/main/cpp app/src/test/cpp/native_tests.cpp -o build/native_tests
      - ./build/native_tests

  test:tools:
    desc: Run the perf report tool tests
    cmds:
      - python3 -B -m unittest discover -s tools -p 'test_*.py'

  build:benchmark:
    desc: Build the benchmark APK (R8 + optimised native, debug-signed) and its instrumented test APK
    cmds:
      - '{{.GRADLEW}} assembleBenchmark assembleBenchmarkAndroidTest --no-daemon'

  bench:
    desc: Run the on-device preview benchmark (adb device + photos in files/bench, see README). THINK_MS=0 measures the fastest-swiping case
    vars:
      THINK_MS: '{{.THINK_MS | default "300"}}'
    cmds:
      - '{{.GRADLEW}} connectedBenchmarkAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.thinkMs={{.THINK_MS}}'

  bench:report:
    desc: Summarise one OmaiPerf log, or compare two (task bench:report -- before.jsonl after.jsonl)
    cmds:
      - python3 tools/perf_report.py {{.CLI_ARGS}}

  build:
    desc: Build Debug APK (.apk)
    cmds:
      - '{{.GRADLEW}} assembleDebug --no-daemon'

  build:release:
    desc: Build Release APK (.apk)
    cmds:
      - '{{.GRADLEW}} assembleRelease --no-daemon'

  install:
    desc: Build and install Debug APK to connected Android device or emulator
    cmds:
      - '{{.GRADLEW}} installDebug --no-daemon'

  clean:
    desc: Clean build artifacts
    cmds:
      - '{{.GRADLEW}} clean --no-daemon'

  all:
    desc: Run Format -> Lint -> Test -> Build in sequence
    cmds:
      - task: format
      - task: lint
      - task: test
      - task: test:native
      - task: test:tools
      - task: build
