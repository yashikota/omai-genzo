# Daemon JVM: ParallelGC suits short bursty builds; a capped metaspace stops AGP/Kotlin plugin leaks
# from growing across builds.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx1536m -XX:+UseParallelGC

# Task-level parallelism, reusable task outputs and a reusable task graph.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# warn, not fail: with AGP lint in the graph the cache is not always reusable, and a build must never fail over it.
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
kotlin.code.style=official
android.nonFinalResIds=false
# Each module's R only holds its own resources: less R.java to compile and faster incremental builds.
android.nonTransitiveRClass=true
